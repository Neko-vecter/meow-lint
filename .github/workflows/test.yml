# this workflow use as pull request check 

name: test

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build wiki
    
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
    # code check
    - name: Checkout checker repo
      uses: actions/checkout@v6
      with:
        repository: Neko-vecter/meow-lint
        path: checker

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Run checker
      run: |
        git diff --name-only \
          ${{ github.event.pull_request.base.sha }} \
          ${{ github.event.pull_request.head.sha }} \
        | grep '\.mdx$' || true \
        | while read -r file; do
            [ -z "$file" ] && continue
            python checker/src/main.py -i "$file"
          done
          
